# 新本機 instance；舊 healthcare-db 與原資料卷保留供核對／回復。
name: wjcch
services:
  db:
    image: postgres:17
    container_name: wjcch
    restart: unless-stopped
    environment:
      POSTGRES_USER: db_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
      POSTGRES_DB: wjcch_db
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wjcch-data:/var/lib/postgresql/data
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    secrets:
      - db_owner_password
      - healthcare_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_owner -d wjcch_db"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  wjcch-data:

secrets:
  db_owner_password:
    file: ./.local/database/secrets/db_owner_password
  healthcare_password:
    file: ./.local/database/secrets/healthcare_password
